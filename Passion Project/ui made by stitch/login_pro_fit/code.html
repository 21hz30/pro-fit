<style>
        /* Neo-Brutalism specific utilities */
        .brutal-border {
            border: 2px solid theme('colors.primary');
        }
        .brutal-shadow {
            box-shadow: 4px 4px 0px 0px theme('colors.primary');
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .brutal-shadow:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px theme('colors.primary');
        }
        .brutal-shadow-hover:hover {
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0px 0px theme('colors.primary');
        }
        .brutal-input:focus {
            outline: none;
            border-color: theme('colors.secondary');
        }
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, theme('colors.outline-variant') 1px, transparent 1px),
                linear-gradient(to bottom, theme('colors.outline-variant') 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden bg-grid-pattern">
<!-- Decorative Architectural Elements -->
<div class="absolute top-0 left-0 w-1/3 h-full border-r-2 border-primary hidden md:block z-0 bg-surface-container-lowest"></div>
<div class="absolute bottom-0 right-0 w-64 h-64 bg-secondary border-t-2 border-l-2 border-primary hidden lg:block z-0 brutal-shadow"></div>
<!-- Login Container -->
<main class="w-full max-w-md mx-auto relative z-10 px-md md:px-0">
<!-- Main Card -->
<div class="bg-surface-container-lowest brutal-border p-0 flex flex-col brutal-shadow">
<!-- Header Strip -->
<div class="bg-primary p-lg text-center brutal-border border-t-0 border-l-0 border-r-0 border-b-2">
<h1 class="font-headline-lg text-headline-lg text-secondary-container tracking-tighter uppercase">PRO-FIT</h1>
<p class="font-label-caps text-label-caps text-on-primary mt-sm uppercase">Athletic Architecture</p>
</div>
<div class="p-lg">
<!-- Role Selection -->
<div class="flex brutal-border mb-lg">
<button class="flex-1 py-sm font-label-caps text-label-caps bg-secondary text-on-secondary border-r-2 border-primary uppercase hover:bg-secondary-container transition-colors">
                        Trainee
                    </button>
<button class="flex-1 py-sm font-label-caps text-label-caps bg-surface text-on-surface uppercase hover:bg-surface-variant transition-colors">
                        Coach
                    </button>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest" for="email">Email Address</label>
<input class="brutal-input brutal-border p-md font-mono-data text-mono-data bg-surface-container-lowest w-full" id="email" placeholder="ATHLETE@DOMAIN.COM" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest" for="password">Password</label>
<a class="font-label-caps text-label-caps text-secondary hover:underline" href="#">Forgot?</a>
</div>
<input class="brutal-input brutal-border p-md font-mono-data text-mono-data bg-surface-container-lowest w-full" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-secondary text-on-secondary p-md font-headline-md text-headline-md uppercase brutal-border brutal-shadow-hover transition-all mt-sm flex items-center justify-center gap-sm" type="submit">
                        Access Terminal
                        <span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-lg pt-md border-t-2 border-primary text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        New recruit? <a class="font-bold text-primary hover:text-secondary underline decoration-2 underline-offset-4" href="#">Initialize Profile</a>
</p>
</div>
</div>
</div>
</main>
